    <path d="M20 60 Q20 10 110 10 Q200 10 200 60 L200 62 L20 62 Z" fill="url(#chest)" stroke="#3a2408" stroke-width="2"/>
    <rect x="20" y="60" width="180" height="58" rx="8" fill="url(#chest)" stroke="#3a2408" stroke-width="2"/>
    <rect x="100" y="52" width="20" height="26" rx="4" fill="url(#gold)" stroke="#8a5a00"/>
    <g fill="url(#gold)" stroke="#c47f10" stroke-width="1.5">
