  </defs>
  <rect width="600" height="480" rx="28" fill="#0d1d38"/>
  <circle cx="500" cy="80" r="90" fill="#f0a92e" opacity="0.14"/>
  <circle cx="70" cy="400" r="70" fill="#3b6cb8" opacity="0.25"/>
  <!-- sparkles -->
  <g fill="#ffd97a">
    <path d="M120 90l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M480 200l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
    <path d="M330 60l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/>
  </g>
  <!-- phone -->
  <g transform="rotate(-6 300 240)">
    <rect x="210" y="70" width="180" height="340" rx="26" fill="url(#ph)" stroke="#3b6cb8" stroke-width="2"/>
    <rect x="224" y="96" width="152" height="262" rx="14" fill="#f5f7fb"/>
    <rect x="268" y="78" width="64" height="8" rx="4" fill="#3b6cb8"/>
    <g>
      <rect x="238" y="112" width="58" height="58" rx="14" fill="#7b2fbe"/><text x="267" y="150" text-anchor="middle" font-size="26" fill="#fff">▶</text>
      <rect x="306" y="112" width="58" height="58" rx="14" fill="#1290c4"/><circle cx="335" cy="141" r="12" fill="none" stroke="#fff" stroke-width="3"/><circle cx="331" cy="137" r="3" fill="#fff"/>
      <rect x="238" y="182" width="58" height="58" rx="14" fill="#1f9d55"/><text x="267" y="220" text-anchor="middle" font-size="24" fill="#fff">$</text>
      <rect x="306" y="182" width="58" height="58" rx="14" fill="#d43d3d"/><path d="M335 196l14 6-14 18-14-18z" fill="#fff"/>
      <rect x="238" y="252" width="126" height="20" rx="10" fill="#e9eff8"/>
      <rect x="238" y="282" width="90" height="20" rx="10" fill="#e9eff8"/>
      <rect x="238" y="312" width="126" height="30" rx="15" fill="url(#gold)"/>
      <text x="301" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#231a05">100% FREE</text>
    </g>
    <rect x="268" y="368" width="64" height="8" rx="4" fill="#3b6cb8"/>
